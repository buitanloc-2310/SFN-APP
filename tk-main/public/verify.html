<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xác minh thẻ điện tử · Sky First Network</title><link rel="icon" type="image/png" href="/sfn-logo.png?v=20260910"><link rel="apple-touch-icon" href="/sfn-logo.png?v=20260910"><link rel="stylesheet" href="/styles.css?v=20261009-member-v8-audit-fix"></head><body class="public-page verify-page"><main class="public-wrap"><div class="public-head"><img data-brand-logo src="/sfn-logo.png?v=20261009-verify" alt="Sky First Network" onerror="this.onerror=null;this.src='/sfn-logo.png'"><div><b data-site-name>Trung Tâm Thành Viên Số Sky First</b><div class="muted">Xác minh hồ sơ điện tử</div></div></div><section class="public-card verify-card"><div class="verify-card-top"><span class="verify-icon">✓</span><div><div class="verify-kicker">SKY FIRST NETWORK</div><h1>Xác minh thẻ điện tử</h1><p>Thông tin xác minh được đối chiếu từ hệ thống Sky First.</p></div></div><div id="verifyBox" class="verify-result"><div class="verify-loading"><span class="verify-spinner"></span> Đang kiểm tra mã xác minh…</div></div><div class="verify-foot"><span>🔒</span> Trang xác minh chính thức · Sky First Network</div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{const code=new URL(location.href).searchParams.get('code')||'';const box=document.querySelector('#verifyBox');if(!code){box.innerHTML='<p>Thiếu mã xác minh.</p>';return}const r=await fetch('/api/public/verify?code='+encodeURIComponent(code)),d=await r.json().catch(()=>({}));if(!r.ok){box.innerHTML='<p>Không tìm thấy hồ sơ hoặc mã không hợp lệ.</p>';return}const x=d.record;if(d.type==='card')box.innerHTML=`<p><span class="badge ${d.valid?'ok':'off'}">${d.valid?'THẺ HỢP LỆ':'THẺ KHÔNG CÒN HIỆU LỰC'}</span></p><div class="verify-person"><img src="${esc((x.avatar_url&&x.avatar_url.startsWith('/files/')&&!x.avatar_url.includes('..')?x.avatar_url:'/sfn-logo.png'))}" alt="Ảnh thành viên" class="verify-person-photo" onerror="this.onerror=null;this.src='/sfn-logo.png';this.classList.add('is-logo')"><div><h2>${esc(x.full_name)}</h2><p><b>Mã thành viên:</b> ${esc(x.member_code)}</p><p><b>Loại thẻ:</b> ${esc(x.card_type_name)}</p><p><b>Chức danh:</b> ${esc(x.title_on_card||'—')}</p><p><b>Đơn vị:</b> ${esc(x.org_name||'Sky First Network')}</p><p><b>Số thẻ:</b> ${esc(x.card_number)}</p><p><b>Hiệu lực:</b> ${esc(x.issued_at||'—')} → ${esc(x.expires_at||'Không thời hạn')}</p><p><b>Trạng thái:</b> ${esc(x.status||'—')}</p></div></div>`;else if(d.type==='one_time')box.innerHTML=`<p><span class="badge ${d.valid?'ok':'off'}">${d.valid?'THẺ ĐANG CÓ HIỆU LỰC':'THẺ KHÔNG CÒN HIỆU LỰC'}</span></p><div class="verify-person"><img data-brand-logo src="/sfn-logo.png" alt="Ảnh" class="verify-person-photo" onerror="this.onerror=null;this.src='/sfn-logo.png';this.classList.add('is-logo')"><div><h2>${esc(x.full_name)}</h2><p><b>Sự kiện:</b> ${esc(x.event_name)}</p><p><b>Vai trò:</b> ${esc(x.role_label||'—')}</p><p><b>Loại:</b> ${esc(x.card_type_name||'Thẻ sự kiện')}</p><p><b>Số thẻ:</b> ${esc(x.card_number)}</p><p><b>Hiệu lực:</b> ${esc(x.issued_at||'—')} → ${esc(x.expires_at||'Không thời hạn')}</p><p><b>Trạng thái:</b> ${esc(x.status||'—')}</p><p class="muted">Đây là nghiệp vụ cấp phát theo sự kiện, không phải tài khoản thành viên.</p></div></div>`;else if(d.type==='verification_qr')box.innerHTML=`<p><span class="badge ${d.valid?'ok':'off'}">${d.valid?'HỒ SƠ ĐANG CÓ HIỆU LỰC':x.status==='pending'?'HỒ SƠ CHƯA ĐẾN NGÀY CẤP':x.status==='revoked'?'HỒ SƠ ĐÃ BỊ THU HỒI':'HỒ SƠ ĐÃ HẾT HIỆU LỰC'}</span></p><h2>${esc(x.full_name)}</h2><p><b>Loại thẻ / giấy xác nhận:</b> ${esc(x.credential_title)}</p><p><b>Vai trò / chức danh:</b> ${esc(x.role_label||'—')}</p><p><b>Đơn vị / chương trình:</b> ${esc(x.organization_label||'—')}</p><p><b>Mã hồ sơ:</b> ${esc(x.reference_number)}</p><p><b>Hiệu lực:</b> ${esc(x.issued_at||'—')} → ${esc(x.expires_at||'Không thời hạn')}</p><p><b>Trạng thái:</b> ${esc(({active:'Đang hiệu lực',pending:'Chưa đến ngày cấp',expired:'Hết hiệu lực',revoked:'Đã thu hồi'})[x.status]||x.status||'—')}</p>${x.public_note?`<p><b>Ghi chú:</b> ${esc(x.public_note)}</p>`:''}<p class="muted">QR này chỉ xác minh hồ sơ được đăng ký; không tạo tài khoản hoặc xác lập tư cách thành viên Sky First Network.</p>`;else box.innerHTML=`<p><span class="badge ${d.valid?'ok':'off'}">${d.valid?'CHỨNG NHẬN ĐÃ XÁC MINH':'CHƯA XÁC MINH'}</span></p><h2>${esc(x.full_name)}</h2><p><b>Mã thành viên:</b> ${esc(x.member_code)}</p><p><b>Chứng nhận:</b> ${esc(x.title)}</p><p><b>Số GCN:</b> ${esc(x.certificate_no||'—')}</p><p><b>Đơn vị cấp:</b> ${esc(x.issuer)}</p><p><b>Ngày cấp:</b> ${esc(x.issued_at||'—')}</p>`})()</script><script src="/brand.js?v=20261009-brand-v1" defer></script></body></html>
