<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thiết lập lần đầu</title><link rel="icon" type="image/png" href="/sfn-logo.png?v=20260910"><link rel="apple-touch-icon" href="/sfn-logo.png?v=20260910"><link rel="stylesheet" href="/styles.css?v=20261009-member-v8-audit-fix"></head><body><div class="auth-shell"><section class="auth-card"><div class="auth-brand-row"><img class="auth-logo" data-brand-logo src="/sfn-logo.png" alt="Sky First Network"><div><div class="brand" data-site-name>Trung Tâm Thành Viên Số Sky First</div><div class="subtitle">THIẾT LẬP HỆ THỐNG LẦN ĐẦU</div></div></div><p class="muted">Tạo tài khoản Quản trị hệ thống đầu tiên. Sau khi hoàn tất, trang thiết lập sẽ tự khóa.</p><form id="setupForm" class="form-grid"><label>Họ và tên<input name="full_name" required maxlength="160"></label><label>Tên đăng nhập<input name="username" required maxlength="80" autocomplete="username"></label><label>Email<input name="email" type="email" maxlength="200"></label><label>Mật khẩu đầu tiên<input name="password" type="password" required minlength="10" autocomplete="new-password"></label><label>Mã bảo vệ thiết lập<input name="setup_token" type="password" required autocomplete="off"><small class="muted">Nhập mã bảo vệ do người quản trị hệ thống cung cấp.</small></label><button class="primary">HOÀN TẤT THIẾT LẬP</button></form><p id="msg" class="msg"></p></section></div><script>document.querySelector('#setupForm').addEventListener('submit',async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target)),setupToken=b.setup_token;delete b.setup_token;const m=document.querySelector('#msg');m.textContent='Đang thiết lập...';const r=await fetch('/api/setup',{method:'POST',headers:{'content-type':'application/json','x-setup-token':setupToken},body:JSON.stringify(b)}),d=await r.json().catch(()=>({}));if(!r.ok){m.textContent='Không thể thiết lập: '+(d.error||r.status);return}location.href='/'})</script><script src="/brand.js?v=20261009-brand-v1" defer></script></body></html>
